version: 1
name: fireline-dynamic-interview
entry_agent: interviewer

agents:
  interviewer:
    instructions: instructions.txt
    think: reasoning
    speak: assistant_voice
    tools:
      - end_call

# Hosted bindings accepted by SLNG for this mock agent on 2026-09-19.
# A spoken interaction must still establish runtime availability and quality.
models:
  think:
    reasoning:
      provider: bedrock
      model: bedrock-mantle/nvidia.nemotron-super-3-120b:latest
  listen:
    transcriber:
      provider: deepgram
      model: deepgram/nova:3
      language: en
  speak:
    assistant_voice:
      provider: slng
      model: deepgram/aura:2
      voice: aura-2-thalia-en

# These describe what the respondent says, not operational decisions. No inferred
# confidence, dispatch, actual transfer or evacuation status is stored here.
variables:
  request_id:
    type: str
    source: call_start
  asset_id:
    type: str
    source: call_start
  snapshot_id:
    type: str
    source: call_start
  incident_brief:
    type: str
    source: call_start
  scenario_notice:
    type: str
    source: call_start
  language:
    type: str
    source: call_start
  road_warning_brief:
    type: str
    source: call_start
  identity_confirmed:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether the respondent explicitly confirms the intended asset location. Unset until answered; record inconclusive if uncertain.
  whole_household_confirmed:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether the respondent explicitly says they can answer for everyone at the intended location. Unset until answered; record inconclusive if uncertain.
  message_received:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether the respondent explicitly confirms receiving the incident message by saying I confirm or an unambiguous equivalent. This is not consent to recording or confirmation of evacuation.
  can_self_evacuate:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether everyone at the intended location can leave without emergency assistance, according to the respondent. Unset if unasked; record inconclusive if unclear.
  transport_available:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether suitable transport is available for everyone, according to the respondent. Unset if unasked; record inconclusive if unclear.
  wants_human:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether the respondent requests a first responder or another person, including requests made before the interview is finished.
  acknowledged:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether the respondent agrees to the final readback of their answers. Separate from initial message receipt.
  help_needs:
    type: str
    source: conversation
    description: A short faithful summary of the respondent's stated assistance needs. Never infer a diagnosis or invent needs.

  road_warning_acknowledged:
    type: str
    source: conversation
    description: One of yes, no, inconclusive. Whether the respondent accurately repeated all supplied road restrictions. Unset when no restrictions supplied; general acknowledgement alone is insufficient.
  road_warning_acknowledged_evidence:
    type: str
    source: conversation
    description: An exact respondent quote repeating the roads to avoid. Leave unset if unclear; never quote the assistant.

  identity_confirmed_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting identity_confirmed. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  message_received_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting message_received. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  can_self_evacuate_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting can_self_evacuate. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  transport_available_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting transport_available. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  wants_human_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting wants_human. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  acknowledged_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting acknowledged. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  help_needs_evidence:
    type: str
    source: conversation
    description: A short exact quote spoken by the respondent supporting help_needs. Leave unset when the answer is inconclusive. Never quote the assistant or invent words.
  whole_household_confirmed_evidence:
    type: str
    source: conversation
    description: A short exact respondent quote confirming or denying their ability to answer for everyone. Leave unset when inconclusive.

tools:
  - end_call

conversation:
  greeting:
    speaks_first: agent
    text: "{{scenario_notice}}. I'm an AI readiness assistant. What building or address are you at?"
  interruption:
    enabled: true

channels:
  web:
    kind: realtime_audio
  # SLNG API dispatch dials through a separately attached trunk.

capacity:
  peak_sessions: 1
  max_sessions: 1
  peak_starts_per_second: 0.1
  avg_session_duration: 4m
