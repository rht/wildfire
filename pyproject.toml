[project]
name = "fireline"
version = "0.1.0"
description = "Values-at-risk decision layer for wildfire response (Hackbarna 2026, track 4)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "shapely",
    "pyproj",
    "networkx",
    "requests",
    "streamlit",
    "pydeck",
    "pandas",
    "anthropic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]
dashboard = ["starlette>=0.40,<1", "uvicorn>=0.30,<1", "websockets>=13,<16"]
dashboard-test = ["httpx>=0.27,<1"]
report = ["reportlab", "defusedxml>=0.7.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fireline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
