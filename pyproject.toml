[project]
name = "fireline"
version = "0.1.0"
description = "Values-at-risk decision layer for wildfire response (Hackbarna 2026, track 4)"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "shapely",
    "pyproj",
    "networkx",
    "requests",
    "streamlit",
    "pydeck",
    "pandas",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]
report = ["reportlab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fireline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
